[project]
name = "walkercov"
version = "0.1.0"
description = "Interactive Walker constellation design and Earth coverage analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "plotly>=5.20",
    "streamlit>=1.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["walkercov*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
